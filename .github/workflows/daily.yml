name: Tägliche News

on:
  schedule:
    # Zusätzliche Absicherung. GitHub startet zeitgesteuerte Läufe bei diesem Repository bisher nicht zuverlässig,
    # deshalb stößt sich der Workflow unten selbst jede Stunde wieder an (Job "naechster").
    # Schwere Quellen (Konflikte, Schiffsverkehr, Träger) laden sich nur alle paar Stunden neu (siehe config.json).
    # Ins Archiv wird nur um 04 und 16 Uhr UTC geschrieben (morgens und nachmittags), damit es nicht überläuft.
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # Tagesarchiv in archive/ ins Repo schreiben
  pages: write
  id-token: write
  actions: write    # damit der Lauf den nächsten Lauf anstoßen darf

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: mego-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Datum für den Zwischenspeicher
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Übersetzungsmodelle zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/mego
          key: mego-translate-${{ steps.day.outputs.d }}
          restore-keys: |
            mego-translate-
      - name: Abhängigkeiten installieren
        run: pip install cryptography ctranslate2 sentencepiece
      - name: News sammeln und Seite bauen
        env:
          # Depot-Positionen und Passwort liegen nur als Secrets, nie im Repo
          DEPOT_JSON: ${{ secrets.DEPOT_JSON }}
          DEPOT_PASSWORT: ${{ secrets.DEPOT_PASSWORT }}
        run: python collect.py
      - name: Tagesarchiv speichern
        # Ein Fehler hier (z. B. Konflikt mit einem gleichzeitigen Lauf) darf die Seite nicht verhindern
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive cache/geo.json cache/elections.json cache/earnings.json
          if ! git diff --cached --quiet; then
            git commit -m "Archiv $(date -u +%F)"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
            done
          fi
      # Fertige Seite für Cloudflare Pages bereitstellen (der Job "cloudflare" holt sie ab)
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 1
      # GitHub Pages: abschaltbar über die Repository-Variable PAGES_OFF=true (nach dem Umzug zu Cloudflare)
      - if: ${{ vars.PAGES_OFF != 'true' }}
        uses: actions/configure-pages@v5
      - if: ${{ vars.PAGES_OFF != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ vars.PAGES_OFF != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages: läuft nur, wenn die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID gesetzt sind
  # (Anleitung: Anleitung_Cloudflare.md). Ohne Secrets bleibt der Job wirkungslos.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Seite holen
        if: ${{ env.CF_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: site
          path: docs
      - name: Zu Cloudflare Pages hochladen
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=${{ vars.CF_PROJECT || 'mego-news' }} --branch=main --commit-dirty=true

  # Kette ohne Token: Der Lauf wartet knapp eine Stunde und startet dann den nächsten.
  # Das darf der eingebaute GITHUB_TOKEN (workflow_dispatch löst als einzige Ausnahme neue Läufe aus).
  # Es wartet immer nur ein Lauf: Ein neuer Warte-Job ersetzt den alten (cancel-in-progress),
  # so verdoppeln sich Ketten auch bei mehreren manuellen Starts nicht.
  naechster:
    needs: [build, deploy, cloudflare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: mego-naechster
      cancel-in-progress: true
    steps:
      - name: Knapp eine Stunde warten, dann nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 3240
          gh workflow run daily.yml --ref main
