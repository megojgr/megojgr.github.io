name: Tägliche News

on:
  schedule:
    # Zusätzliche Absicherung. GitHub startet zeitgesteuerte Läufe bei diesem Repository bisher nicht zuverlässig,
    # deshalb stößt sich der Workflow unten selbst jede Stunde wieder an (Job "naechster").
    # Schwere Quellen (Konflikte, Schiffsverkehr, Träger) laden sich nur alle paar Stunden neu (siehe config.json).
    # Ins Archiv wird nur um 04 und 16 Uhr UTC geschrieben (morgens und nachmittags), damit es nicht überläuft.
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # Tagesarchiv in archive/ ins Repo schreiben
  pages: write
  id-token: write
  actions: write    # damit der Lauf den nächsten Lauf anstoßen darf

jobs:
  build:
    runs-on: ubuntu-latest
    # Ein hängender Abruf darf die Kette nicht stundenlang blockieren (Standard wären 6 Stunden)
    timeout-minutes: 30
    outputs:
      generated: ${{ steps.stand.outputs.generated }}
    concurrency:
      group: mego-build
      cancel-in-progress: false
    steps:
      # Der Code liegt in einem privaten Repository. Dieser öffentliche Ablaufplan holt ihn mit einem
      # Zugangsschlüssel nur für dieses eine Repository (Secret MEGO_CODE_KEY). Das Tagesarchiv wird dorthin gespeichert.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO || 'megojgr/mego-news' }}
          ssh-key: ${{ secrets.MEGO_CODE_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Datum für den Zwischenspeicher
        id: day
        run: |
          echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "b=$(date -u +%F)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - name: Übersetzungsmodelle zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/mego
          key: mego-translate-${{ steps.day.outputs.d }}
          restore-keys: |
            mego-translate-
      # Langzeitverläufe (10 Jahre) ändern sich kaum: Sie liegen hier und werden nur etwa wöchentlich je Wert neu geholt
      - name: Langzeitverläufe zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/mego-long
          key: mego-long-${{ steps.day.outputs.b }}
          restore-keys: |
            mego-long-
      - name: Abhängigkeiten installieren
        run: pip install --retries 5 --timeout 60 cryptography ctranslate2 sentencepiece
      - name: Zusatzpaket für die GPS-Störungen
        continue-on-error: true
        run: pip install --retries 5 --timeout 60 h3
      - name: News sammeln und Seite bauen
        env:
          # Depot-Positionen und Passwort liegen nur als Secrets, nie im Repo
          DEPOT_JSON: ${{ secrets.DEPOT_JSON }}
          DEPOT_PASSWORT: ${{ secrets.DEPOT_PASSWORT }}
          # Passwort für die ganze Seite (Zugang). Fehlt es, ist die Seite offen.
          SITE_PASSWORT: ${{ secrets.SITE_PASSWORT }}
          # Kostenlose KI für den Überblick: Ein einziger dieser Schlüssel reicht (Anleitung: anleitungen/Anleitung_KI.md).
          # Fehlen alle, läuft die Seite wie bisher ohne KI-Texte.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python collect.py
      - name: Zeitstempel des neuen Stands merken
        id: stand
        run: echo "generated=$(python -c "import json;print(json.load(open('docs/data.json',encoding='utf-8'))['generated'])")" >> "$GITHUB_OUTPUT"
      - name: Tagesarchiv speichern
        # Ein Fehler hier (z. B. Konflikt mit einem gleichzeitigen Lauf) darf die Seite nicht verhindern
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive cache/geo.json cache/elections.json cache/earnings.json cache/universe.json cache/xetra_etfs.json cache/etf_names.json cache/xetra_stocks.json cache/stock_names.json
          if ! git diff --cached --quiet; then
            git commit -m "Archiv $(date -u +%F)"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then break; fi
              git rebase --abort 2>/dev/null || true
            done
          fi
      # Fertige Seite für Cloudflare Pages bereitstellen (der Job "cloudflare" holt sie ab)
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          retention-days: 1
      # GitHub Pages: abschaltbar über die Repository-Variable PAGES_OFF=true (nach dem Umzug zu Cloudflare)
      - if: ${{ vars.PAGES_OFF != 'true' }}
        uses: actions/configure-pages@v5
      - if: ${{ vars.PAGES_OFF != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ vars.PAGES_OFF != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # GitHub bleibt beim Veröffentlichen gelegentlich in "updating_pages" hängen. Dann nach 5 Minuten abbrechen
      # und es ein zweites Mal versuchen, statt bis zum nächsten stündlichen Lauf den alten Stand zu zeigen.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
      # Nachsehen, ob die echte Seite wirklich den neuen Stand ausliefert (GitHub meldet manchmal Erfolg ohne neue Seite)
      - name: Prüfen, ob die Seite neu ist
        id: check1
        if: ${{ steps.deployment.outcome == 'success' }}
        continue-on-error: true
        env:
          WANT: ${{ needs.build.outputs.generated }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: bash .github/scripts/live_check.sh 240
      - name: Kurz warten vor dem zweiten Versuch
        if: ${{ steps.deployment.outcome == 'failure' || steps.check1.outputs.ok != 'true' }}
        run: sleep 45
      - id: deployment2
        if: ${{ steps.deployment.outcome == 'failure' || steps.check1.outputs.ok != 'true' }}
        uses: actions/deploy-pages@v4
        with:
          timeout: 420000
      # Klappt auch der zweite Versuch nicht, schlägt der Job fehl: Dann startet der nächste Lauf schon nach 12 Minuten
      - name: Nach dem zweiten Versuch erneut prüfen
        if: ${{ steps.deployment2.outcome == 'success' }}
        env:
          WANT: ${{ needs.build.outputs.generated }}
          URL: ${{ steps.deployment2.outputs.page_url }}
        run: bash .github/scripts/live_check.sh 300 strict

  # Cloudflare: läuft nur, wenn die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID gesetzt sind
  # (Anleitung: anleitungen/Anleitung_Cloudflare.md). Ohne Secrets bleibt der Job wirkungslos.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Seite holen
        if: ${{ env.CF_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: site
          path: docs
      # Cloudflare empfiehlt für neue Seiten Workers mit statischen Dateien: Der Worker wird beim ersten Lauf angelegt
      - name: Zu Cloudflare hochladen
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets=docs --name=${{ vars.CF_PROJECT || 'mego-news' }} --compatibility-date=2026-10-01

  # Kette ohne Token: Der Lauf wartet knapp eine Stunde und startet dann den nächsten.
  # Das darf der eingebaute GITHUB_TOKEN (workflow_dispatch löst als einzige Ausnahme neue Läufe aus).
  # Es wartet immer nur ein Lauf: Ein neuer Warte-Job ersetzt den alten (cancel-in-progress),
  # so verdoppeln sich Ketten auch bei mehreren manuellen Starts nicht.
  # Nach einem Fehler (Abruf oder Veröffentlichen) wartet die Kette nur 12 Minuten, damit die Seite schnell wieder aktuell ist.
  # Der Start des nächsten Laufs wird wiederholt und kontrolliert, damit die Kette nicht an einem kurzen GitHub-Fehler abreißt.
  naechster:
    needs: [build, deploy, cloudflare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: mego-naechster
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Knapp eine Stunde warten, dann nächsten Lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.build.result != 'success' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled' }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "Dieser Lauf hatte einen Fehler: nächster Versuch schon in 12 Minuten"
            sleep 720
          else
            sleep 3240
          fi
          bash .github/scripts/dispatch.sh
