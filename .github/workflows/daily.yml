name: Tägliche News

on:
  schedule:
    # Stündlich, damit Nachrichten und die Live-Übersicht frisch bleiben. GitHub startet oft ein paar Minuten später.
    # Schwere Quellen (Konflikte, Schiffsverkehr, Träger) laden sich nur alle paar Stunden neu (siehe config.json).
    # Ins Archiv wird nur um 04 und 16 Uhr UTC geschrieben (morgens und nachmittags), damit es nicht überläuft.
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # Tagesarchiv in archive/ ins Repo schreiben
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Datum für den Zwischenspeicher
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Übersetzungsmodelle zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/mego
          key: mego-translate-${{ steps.day.outputs.d }}
          restore-keys: |
            mego-translate-
      - name: Abhängigkeiten installieren
        run: pip install cryptography ctranslate2 sentencepiece
      - name: News sammeln und Seite bauen
        env:
          # Depot-Positionen und Passwort liegen nur als Secrets, nie im Repo
          DEPOT_JSON: ${{ secrets.DEPOT_JSON }}
          DEPOT_PASSWORT: ${{ secrets.DEPOT_PASSWORT }}
        run: python collect.py
      - name: Tagesarchiv speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive cache/geo.json cache/elections.json
          if ! git diff --cached --quiet; then
            git commit -m "Archiv $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
