<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#17160f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mego News">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>Mego News</title>
<style>
  :root {
    --bg: #fbfaf6; --paper: #ffffff; --ink: #17160f; --muted: #66645b; --line: #e3e0d5; --soft: #f1efe7;
    --link: #1b3a6b; --red: #b3261e; --up: #137a4b; --down: #b3261e;
    --band: #17160f; --band-ink: #f3f1e8; --band-up: #62d493; --band-down: #ff8f84; --shadow: rgba(0,0,0,.35);
    --serif: Georgia, "Times New Roman", "Noto Serif", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121210; --paper: #1a1a17; --ink: #efede4; --muted: #a09e93; --line: #2d2c27; --soft: #22221e;
      --link: #8fb4ff; --red: #ff8f84; --up: #55c88a; --down: #ff8f84;
      --band: #1f1f1b; --band-ink: #efede4; --band-up: #62d493; --band-down: #ff8f84; --shadow: rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  a { color: inherit; text-decoration: none; }
  a:not([href]) { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .up { color: var(--up); } .down { color: var(--down); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  /* Kopf */
  .mast { border-top: calc(5px + env(safe-area-inset-top)) solid var(--ink); background: var(--bg); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  .mast-bar { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; font-size: 12.5px; color: var(--muted); }
  .mast-bar .grow { flex: 1; }
  .mast h1 { margin: 0; padding: 2px 0 4px; text-align: center; font: 700 clamp(30px, 6vw, 46px)/1.05 var(--serif); letter-spacing: -.015em; }
  .statusline { text-align: center; font-size: 12.5px; color: var(--muted); padding: 0 0 12px; min-height: 30px; }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 15px; font-size: 13px; min-height: 36px; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .btn[disabled] { opacity: .55; cursor: progress; }
  .btn.icon { padding: 5px 10px; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alertbar a { display: block; background: #b3261e; color: #fff; padding: 8px 0; font-size: 14px; text-align: center; }
  .alertbar b { text-transform: uppercase; letter-spacing: .06em; font-size: 12px; margin-right: 6px; }
  .alertbar .up, .alertbar .down { color: #fff; font-weight: 700; }

  /* Börsenband */
  .band { background: var(--band); color: var(--band-ink); }
  .band .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-top: 2px; padding-bottom: 2px; }
  .band .wrap::-webkit-scrollbar { display: none; }
  .tk { flex: none; background: none; border: 0; color: inherit; padding: 7px 12px; font-size: 13px; white-space: nowrap; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .tk:hover { background: rgba(255,255,255,.12); }
  .tk b { font-weight: 600; opacity: .72; margin-right: 6px; }
  .tk em { font-style: normal; margin-left: 6px; }
  .tk .up { color: var(--band-up); } .tk .down { color: var(--band-down); }
  .tk.depot { font-weight: 700; border: 1px solid rgba(255,255,255,.35); margin: 3px 8px 3px 0; padding: 4px 12px; }

  /* Reiter (Rechner): feste Leiste mit sechs Bereichen, darunter das Börsenband */
  .tabs { position: sticky; top: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tabs .wrap { display: flex; justify-content: center; gap: 6px; }
  .tabs button { flex: 0 1 auto; background: none; border: 0; padding: 0 22px; min-height: 54px; font-size: 13.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  .tabs button:hover { color: var(--ink); background: var(--soft); }
  .band { margin-top: 0; }
  .band .wrap { padding-top: 4px; padding-bottom: 4px; }
  .tk:hover { background: none; text-decoration: underline; }

  /* Unterreiter innerhalb eines Bereichs */
  .seg { display: flex; gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin: 16px 0 4px; max-width: 640px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 10px 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button:not([aria-pressed="true"]):hover { color: var(--ink); }

  /* Navigationsleiste unten (Handy) */
  .bottombar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,.12); }
  .bottombar button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 7px 2px 5px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; border-radius: 10px; position: relative; }
  .bottombar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bottombar button[aria-selected="true"] { color: var(--ink); }
  .bottombar button[aria-selected="true"] svg { stroke-width: 2.4; }
  .bottombar button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
  .bottombar .dot { position: absolute; top: 6px; right: calc(50% - 20px); margin: 0; }

  main { padding: 6px 0 64px; min-height: 60vh; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 40px; }
  @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 320px; } }
  .narrow { max-width: 760px; }

  .sec { margin: 26px 0 8px; padding-top: 7px; border-top: 2px solid var(--ink); font: 700 12px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .sec span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 14px; }
  .note.bad, footer .bad { color: var(--down); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  /* Meldungen */
  .item { padding: 15px 0 16px; border-bottom: 1px solid var(--line); }
  .kicker { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .kicker .t { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .kicker .red { color: var(--red); }
  .kicker .tag { background: var(--ink); color: var(--bg); padding: 1px 7px; border-radius: 3px; letter-spacing: .05em; }
  .kicker .tag.crash { background: var(--red); color: #fff; }
  .kicker .tag.dep { background: var(--link); color: var(--bg); }
  .kicker .tag.tr { background: none; color: var(--muted); border: 1px solid var(--line); font: 600 10.5px var(--sans); letter-spacing: .04em; cursor: pointer; }
  .kicker .tag.tr:hover { color: var(--ink); border-color: var(--ink); }
  .teaser[hidden] { display: none; }
  .hl { margin: 0; font: 700 20px/1.28 var(--serif); letter-spacing: -.005em; }
  .hl a:hover { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .item.lead { padding-top: 20px; }
  .item.lead .hl { font-size: clamp(25px, 4vw, 33px); line-height: 1.18; }
  .teaser { margin: 7px 0 0; color: var(--muted); font-size: 15.5px; line-height: 1.5; }
  .srcs { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
  .srcs a:hover { color: var(--link); text-decoration: underline; }
  .srcs .n { color: var(--red); font-weight: 600; }

  /* Seitenspalte */
  .side .blk { margin-bottom: 26px; }
  .qrow { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; text-align: left; font-size: 14px; font-variant-numeric: tabular-nums; align-items: baseline; }
  .qrow:hover { background: var(--soft); }
  .qrow .px { color: var(--muted); }
  .qrow .pc { min-width: 62px; text-align: right; font-weight: 600; }
  .mini { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mini b { display: block; font-weight: 600; }
  .mini span { color: var(--muted); font-size: 12.5px; }
  .mini a:hover { color: var(--link); }

  /* Auf einen Blick */
  .glance { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 14px 18px 8px; margin: 18px 0 4px; }
  .glance h2 { margin: 0 0 6px; font: 700 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .glance dl { margin: 0; }
  .glance .g { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .glance .g:first-of-type { border-top: 0; }
  .glance dt { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
  .glance dd { margin: 0; }
  .glance dd a:hover { color: var(--link); text-decoration: underline; }
  @media (max-width: 520px) { .glance .g { grid-template-columns: 1fr; gap: 2px; } }

  /* Kurse, Depot */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .qc { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .qc:hover { border-color: var(--ink); }
  .qc.alert { border-color: var(--red); box-shadow: inset 3px 0 0 var(--red); }
  .qc b { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .qc .px { display: block; font: 600 17px/1.3 var(--sans); font-variant-numeric: tabular-nums; }
  .qc .px em { font-style: normal; font-size: 12.5px; margin-left: 6px; }
  .qc small { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 30px; margin: 5px 0 3px; display: block; }
  .spark polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .spark .u { stroke: var(--up); } .spark .d { stroke: var(--down); }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; gap: 4px 14px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; font-variant-numeric: tabular-nums; }
  .prow:hover { background: var(--soft); }
  .prow .nm { font: 700 17px/1.25 var(--serif); }
  .prow .nm small { display: block; font: 400 12px/1.4 var(--sans); color: var(--muted); }
  .prow .pv { text-align: right; font-size: 15px; } .prow .pv small { display: block; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .prow { grid-template-columns: minmax(0, 1fr) auto; } .prow .spark { display: none; } }
  .lock { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 22px; max-width: 460px; margin: 24px 0; }
  .lock h2 { margin: 0 0 6px; font: 700 22px var(--serif); }
  .lock input[type=password], .dlg input[type=password], .dlg input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: var(--bg); color: var(--ink); margin: 10px 0 8px; }
  .lock label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 12px; }

  /* Filter */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
  .filters button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Wetten */
  .bet { padding: 14px 0 16px; border-bottom: 1px solid var(--line); }
  .bet .hl { font-size: 18px; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: minmax(80px, 1.2fr) 2fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0; }
  .row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 7px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
  .pct { font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; font-weight: 600; }
  .pct small { font-size: 11px; margin-left: 4px; font-weight: 400; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .meta .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

  /* Kalender, Sendungen */
  .cal { display: grid; grid-template-columns: 92px 1fr; gap: 2px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .cal .d { font-weight: 700; font-variant-numeric: tabular-nums; }
  .cal .d small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .cal b { font-family: var(--serif); font-size: 16.5px; }
  .cal.imp b::after { content: "wichtig"; font: 600 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--bg); background: var(--ink); border-radius: 3px; padding: 1px 6px; margin-left: 8px; vertical-align: 2px; }
  .cal a:hover { text-decoration: underline; color: var(--link); }
  .show { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 14px 18px 12px; margin-bottom: 14px; }
  .show h3 { margin: 0; font: 700 19px/1.3 var(--serif); }
  .show h3 a:hover { color: var(--link); text-decoration: underline; }
  .show .when { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
  .show ol { margin: 0; padding-left: 20px; font-size: 15px; } .show li { margin: 3px 0; }
  .term { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .term .lead { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .term .meta { grid-column: 1 / -1; margin-top: 2px; }
  .term a:hover { color: var(--link); text-decoration: underline; }
  details.day { border-bottom: 1px solid var(--line); padding: 10px 0; }
  details.day summary { cursor: pointer; font: 700 17px var(--serif); }
  details.day summary span { font: 400 13px var(--sans); color: var(--muted); margin-left: 10px; }
  details.day ul { margin: 8px 0 12px; padding-left: 20px; font-size: 14.5px; } details.day li { margin: 3px 0; }
  details.day h4 { margin: 10px 0 0; font: 700 11.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* Dialoge */
  dialog { border: 0; padding: 0; background: var(--paper); color: var(--ink); width: min(760px, 96vw); max-height: 94vh; border-radius: 12px; box-shadow: 0 20px 60px var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg { padding: 20px 22px 26px; }
  .dlg .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .dlg h2 { margin: 2px 0 2px; font: 700 26px/1.2 var(--serif); }
  .dlg .sub { color: var(--muted); font-size: 13px; }
  .dlg .big { font: 700 30px/1.2 var(--sans); font-variant-numeric: tabular-nums; margin: 10px 0 0; }
  .dlg .big small { font-size: 15px; font-weight: 600; margin-left: 10px; }
  .ranges { display: flex; gap: 6px; margin: 14px 0 6px; flex-wrap: wrap; }
  .ranges button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 13px; font-size: 13px; }
  .ranges button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .info { font-size: 13px; color: var(--muted); min-height: 20px; font-variant-numeric: tabular-nums; }
  .chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px 14px; margin: 14px 0 4px; }
  .stats div { border-top: 1px solid var(--line); padding-top: 5px; font-size: 12px; color: var(--muted); }
  .stats b { display: block; font: 600 15.5px var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 13.5px; }
  .links a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
  .ids { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px 16px; flex-wrap: wrap; }
  .ids button { border: 0; background: none; padding: 0; color: inherit; font-size: inherit; text-decoration: underline dotted; }
  .dlg ol.steps { padding-left: 20px; font-size: 14px; } .dlg ol.steps li { margin: 4px 0; }
  .dlg .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .dlg h3.sec2 { font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; margin: 22px 0 4px; padding-top: 6px; border-top: 2px solid var(--ink); }

  /* Globus */
  .globe-wrap { display: grid; gap: 18px 28px; grid-template-columns: minmax(0, 1fr); padding-top: 14px; }
  @media (min-width: 980px) { .globe-wrap { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } .gfoot { grid-column: 1 / -1; } }
  .gstage { position: relative; background: radial-gradient(ellipse at 50% 40%, #0e1c2e, #050a12); border-radius: 12px; overflow: hidden; border: 1px solid #1a2a3d; }
  .gcanvas { display: block; width: 100%; touch-action: none; cursor: grab; }
  .gbtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .gbtns button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgba(160,200,255,.3); background: rgba(10,20,34,.8); color: #e8eef6; font-size: 20px; line-height: 1; }
  .glegend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(8,16,28,.72); border: 1px solid rgba(160,200,255,.18); border-radius: 8px; padding: 7px 10px; font-size: 11.5px; color: #cfe0f2; pointer-events: none; }
  .glegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
  @media (max-width: 520px) { .glegend { font-size: 10.5px; padding: 5px 8px; } }
  .gtip { position: absolute; pointer-events: none; background: rgba(5,10,18,.92); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; max-width: 240px; }
  .gtip.on { opacity: 1; }
  .gside { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .ginfo, .gctl, .glists > div { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 14px 16px; }
  .glists { display: flex; flex-direction: column; gap: 16px; }
  .ginfo h3, .gctl h3, .glists h3 { margin: 0 0 8px; font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .ginfo h3:first-child { font: 700 20px/1.25 var(--serif); letter-spacing: 0; text-transform: none; }
  .gctl h3:not(:first-child) { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ginfo p { margin: 6px 0; font-size: 14.5px; } .ginfo a { text-decoration: underline; text-underline-offset: 3px; color: var(--link); }
  .ginfo h4, .glists h4 { margin: 12px 0 2px; font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .gtag { display: inline-block; font: 700 11px var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--ink); color: var(--bg); margin-bottom: 6px; }
  .gtag.bad { background: #b3261e; color: #fff; }

    const r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    show(Math.max(0, Math.min(n - 1, Math.round(((x - L) / (W - L - R)) * (n - 1)))), true);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => show(n - 1, false));
  svg.append(hit);
  show(n - 1, false);
  return svg;
}

  const [yA] = rangeOf(q, "YTD");

    rangeBar, info, chartBox,
    h("div", { class: "stats" },
      stat("1 Woche", pctSpan(pctBack(5))), stat("1 Monat", pctSpan(pctBack(21))), stat("3 Monate", pctSpan(pctBack(63))),
      stat("6 Monate", pctSpan(pctBack(126))), stat("seit Jahresbeginn", pctSpan(q.c.length > yA ? (q.price / q.c[yA] - 1) * 100 : null)),
      stat("1 Jahr", pctSpan(q.c.length > 200 ? (q.price / q.c[0] - 1) * 100 : null)),
      stat("52-Wochen-Hoch", q.hi52 ? [price(q.hi52), " ", pctSpan(fromHi)] : "–"), stat("52-Wochen-Tief", price(q.lo52))),
    h("div", { class: "links" },

  if (nowLive || upcoming.length) rows.push(["Live", [`${nowLive} Sender senden gerade`, upcoming.map(c => [`  ·  ${c.name}: ${c.title.slice(0, 70)} (${new Date(c.start * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr)`]), "  ", h("a", { href: "#live", onclick: (e) => { e.preventDefault(); show("live"); } }, "zum Live-Reiter")]]);

  const soon = DATA.termine.filter(t => (new Date(t.end + "T23:59:59") - Date.now()) < 2 * dayMs).slice(0, 3);

  const ts = DATA.briefings.find(b => b.name === "tagesschau 20 Uhr");

  return box;

function startText(epoch) {
  const d = new Date(epoch * 1000), min = Math.round((d - Date.now()) / 60000);
  const when = d.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const rel = min < -5 ? "läuft vermutlich schon" : min < 60 ? `in ${Math.max(0, min)} Min.` : min < 1440 ? `in ${Math.round(min / 60)} Std.` : `in ${Math.round(min / 1440)} Tg.`;
  return `${when} Uhr (${rel})`;
}

// Zeit bis zur nächsten tagesschau um 20:00 Uhr (Berliner Zeit)
function tagesschauCountdown() {
  const berlin = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Berlin" }));
  const target = new Date(berlin); target.setHours(20, 0, 0, 0);
  if (berlin - target > 20 * 60000) target.setDate(target.getDate() + 1);
  const min = Math.round((target - berlin) / 60000);
  if (min <= 0) return "läuft jetzt (20:00 bis ca. 20:15 Uhr).";
  return min >= 60 ? `heute 20:00 Uhr, in ${Math.floor(min / 60)} Std. ${min % 60} Min.` : `gleich, in ${min} Min. (20:00 Uhr).`;
}

// Globus erst beim Öffnen des Reiters laden (d3 und Weltkarte sind zusammen etwa 450 KB)
async function loadGlobe() {
  if (!window.MegoGlobe) {
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "globe.js?v=" + encodeURIComponent(DATA.generated); s.onload = res;  // nach jedem Lauf frisch laden s.onerror = () => rej(new Error("globe.js fehlt"));
      document.head.append(s);
    });
  }
  await window.MegoGlobe.loadAssets();
}

function paintView() {
  const tab = CURRENT, kids = [];
  if (SUBS[tab]) kids.push(h("div", { class: "seg", role: "tablist" }, SUBS[tab].map(s =>
    h("button", { "aria-pressed": String(s === SUB[tab]), onclick: () => { SUB[tab] = s; store.set("sub", JSON.stringify(SUB)); paintView(); scrollTo(0, 0); } }, s))));
  kids.push(BUILD[tab](SUB[tab]));
  $("view").replaceChildren(...kids.flat(Infinity).filter(Boolean));
}

function show(id, sub) {
  const route = ROUTES[id];
  let tab = route ? route[0] : id;
  if (route) sub = sub || route[1];
  if (!BUILD[tab]) tab = "heute";
  CURRENT = tab;
  if (tab === "region" && route) store.set("regionf", route[1]);
  if (SUBS[tab]) SUB[tab] = sub && SUBS[tab].includes(sub) ? sub : (SUB[tab] && SUBS[tab].includes(SUB[tab]) ? SUB[tab] : SUBS[tab][0]);
  document.querySelectorAll("#tabs button, #bottombar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === tab)));
  paintView();
  store.set("tab", tab); store.set("sub", JSON.stringify(SUB));
  history.replaceState(null, "", "#" + tab);
  scrollTo(0, 0);
}

}

function renderAll() { renderChrome(); show(CURRENT); }

// ------------------------------------------------------------------ Depot entsperren

async function decryptDepot(enc, pw) {
  const bytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(enc.iv) }, key, bytes(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlockDepot(pw, remember) {
  const d = DATA.depot;
  if (!d) throw new Error("kein Depot");
  if (d.state === "plain") { DEPOT = d.data; return; }
  if (d.state !== "enc") throw new Error("gesperrt");
  DEPOT = await decryptDepot(d.enc, pw);
  if (remember) store.set("depotpw", pw);
}
async function autoUnlock() {
  DEPOT = null;
  const d = DATA.depot;
  if (!d) return;
  if (d.state === "plain") { DEPOT = d.data; return; }
  const pw = store.get("depotpw");
  if (d.state === "enc" && pw) { try { await unlockDepot(pw, false); } catch { store.del("depotpw"); } }
}

// ------------------------------------------------------------------ Aktualisieren

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Meldung am unteren Rand: sagt klar, ob das Aktualisieren geklappt hat oder woran es scheiterte
let toastTimer = null;
function toast(kind, msg, o = {}) {
  const t = $("toast"), icon = { ok: "✓", err: "✕", warn: "!", info: "i", busy: "↻" }[kind];
  t.className = "toast show " + kind;
  t.replaceChildren(...[h("span", { class: "ico" }, icon), h("span", {}, msg),
    o.link && h("a", { href: o.link.url }, o.link.text),
    h("button", { class: "x", "aria-label": "Schließen", onclick: () => t.classList.remove("show") }, "×")].filter(Boolean));
  clearTimeout(toastTimer);
  if (kind !== "busy") toastTimer = setTimeout(() => t.classList.remove("show"), o.ms || (kind === "err" || kind === "warn" ? 14000 : 8000));
}
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

async function fetchLatest() {
  const url = new URL("data.json", location.href);
  url.searchParams.set("t", Date.now());
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`Der neue Stand konnte nicht geladen werden (Fehler ${r.status}).`);
  const d = await r.json();
  d.history ||= [];
  return d;
}
async function applyData(d) {
  DATA = d; await autoUnlock();
  // Läuft gerade ein Stream, soll das Update ihn nicht abbrechen: nur den Rahmen erneuern
  if (CURRENT === "live" && document.querySelector(".pstage iframe")) renderChrome(); else renderAll();
}

const gh = (path, token, opts = {}) => fetch(`https://api.github.com/repos/${DATA.repo}${path}`, {
  ...opts, headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token, "X-GitHub-Api-Version": "2022-11-28" } });

async function dispatchRun(token) {
  const r = await gh("/actions/workflows/daily.yml/dispatches", token, { method: "POST", body: JSON.stringify({ ref: "main" }) });
  if ([401, 403, 404].includes(r.status)) throw new Error("Das Token ist ungültig oder hat nicht das Recht „Actions: Read and write“. Bitte unter ⚙ prüfen.");
  if (r.status !== 204) throw new Error("GitHub antwortet mit Fehler " + r.status);
}
async function findRun(token, since) {
  const r = await gh("/actions/workflows/daily.yml/runs?event=workflow_dispatch&per_page=5", token);
  if (!r.ok) return null;
  return ((await r.json()).workflow_runs || []).find(x => new Date(x.created_at) >= since) || null;
}
async function runState(token, id) {
  const r = await gh("/actions/runs/" + id, token);
  return r.ok ? r.json() : null;
}
const friendly = (e) => /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? "Keine Verbindung zum Server. Bist du online?" : e.message;

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  if (location.protocol === "file:") { location.reload(); return; }
  refreshing = true;
  const btn = $("btn-refresh"), before = DATA;
  const setBtn = (text, spin) => btn.replaceChildren(h("span", { class: "ic" + (spin ? " spin" : "") }, spin ? "↻" : "↻"), h("span", { class: "lb" }, " " + text));
  btn.disabled = true; setBtn("Lädt …", true);
  let ok = false;
  try {
    if (navigator.onLine === false) throw new Error("Keine Internetverbindung.");
    const token = store.get("ghtoken");
    let fresh = null;
    if (token) {
      toast("busy", "Neuer Abruf wird bei GitHub gestartet …");
      await dispatchRun(token);
      const t1 = Date.now();
      let run = null, failed = null;
      while (Date.now() - t1 < 8 * 60000) {
        await sleep(10000);
        const secs = Math.round((Date.now() - t1) / 1000);
        try { run = run ? (await runState(token, run.id)) || run : await findRun(token, new Date(t1 - 90000)); } catch {}
        if (run && run.status === "completed" && run.conclusion !== "success") { failed = run; break; }
        let d = null;
        try { d = await fetchLatest(); } catch {}
        if (d && d.generated !== before.generated) { fresh = d; break; }
        toast("busy", !run ? `Neuer Abruf läuft … ${secs} s`
          : run.status === "completed" ? `Seite wird veröffentlicht … ${secs} s`
          : run.status === "queued" ? `Wartet bei GitHub … ${secs} s` : `GitHub sammelt Nachrichten … ${secs} s`);
      }
      if (failed) {
        toast("err", `Der Abruf bei GitHub ist fehlgeschlagen (${failed.conclusion}). Du siehst weiter den alten Stand von ${fmtTime(before.generated)} Uhr.`, { link: { url: failed.html_url, text: "Protokoll" } });
        return;
      }
      if (!fresh) { toast("warn", `Der Abruf dauert ungewöhnlich lange. Du siehst weiter den Stand von ${fmtTime(before.generated)} Uhr. Bitte später erneut versuchen.`); return; }
    } else {
      toast("busy", "Suche nach einem neueren Stand …");
      const d = await fetchLatest();
      if (d.generated === before.generated) {
        toast("info", `Kein neuerer Stand vorhanden, letzte Aktualisierung ${fmtTime(before.generated)} Uhr. Die Seite wird stündlich aktualisiert. Für einen sofortigen Abruf richte unter ⚙ das Token ein.`, { ms: 11000 });
        return;
      }
      fresh = d;
    }
    const seen = new Set(before.stories.map(s => s.url));
    const added = fresh.stories.filter(s => !seen.has(s.url)).length;
    await applyData(fresh);
    ok = true;
    toast("ok", `Aktualisiert: Stand ${fmtTime(fresh.generated)} Uhr, ${added} neue Meldung${added === 1 ? "" : "en"}.`);
  } catch (e) {
    toast("err", "Aktualisieren hat nicht geklappt: " + friendly(e));
  } finally {
    refreshing = false; btn.disabled = false;
    setBtn(ok ? "Aktualisiert" : "Aktualisieren", false);
    if (ok) setTimeout(() => { if (!refreshing) setBtn("Aktualisieren", false); }, 3500);
  }
}
$("btn-refresh").addEventListener("click", refresh);

// Beim Zurückkehren zur Seite still prüfen, ob es einen neueren Stand gibt
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || refreshing || location.protocol === "file:") return;
  try {
    const d = await fetchLatest();
    if (d.generated !== DATA.generated) { await applyData(d); toast("ok", `Neuer Stand geladen: ${fmtTime(d.generated)} Uhr.`, { ms: 5000 }); }
  } catch {}
});

// ------------------------------------------------------------------ Einstellungen

function openSettings() {
  const dlg = $("settings");
  const msg = h("div", { class: "note" });
  const tok = h("input", { type: "password", placeholder: "github_pat_…", autocomplete: "off" });
  tok.value = store.get("ghtoken") || "";
  const repo = DATA.repo || "megojgr/megojgr.github.io";
  const prefill = `https://github.com/settings/personal-access-tokens/new?name=Mego+News+Aktualisieren&description=Startet+den+Aktualisieren-Knopf+der+Seite&target_name=${encodeURIComponent(repo.split("/")[0])}&expires_in=365&actions=write`;
  const testToken = async () => {
    const v = tok.value.trim() || store.get("ghtoken");
    if (!v) { msg.textContent = "Bitte zuerst das Token einfügen."; return; }
    msg.textContent = "Prüfe …";
    try {
      const r = await gh("/actions/workflows/daily.yml", v);
      msg.textContent = r.status === 200 ? "✓ Das Token funktioniert. Der Aktualisieren-Knopf startet jetzt sofort neue Abrufe."
        : r.status === 401 ? "✕ Das Token ist ungültig oder abgelaufen."
        : r.status === 403 || r.status === 404 ? "✕ Keine Berechtigung: Prüfe, ob das richtige Repository gewählt ist und „Actions“ auf „Read and write“ steht."
        : "✕ GitHub antwortet mit Fehler " + r.status;
    } catch (e) { msg.textContent = "✕ Keine Verbindung: " + e.message; }
  };
  dlg.replaceChildren(h("div", { class: "dlg" },
    h("div", { class: "top" }, h("h2", {}, "Einstellungen"), h("button", { class: "btn", onclick: () => dlg.close() }, "Schließen")),
    h("h3", { class: "sec2" }, "Sofort-Update"),
    h("p", { class: "note" }, "Die Seite aktualisiert sich ohnehin jede Stunde von selbst. Mit einem Token startet „Aktualisieren“ sofort einen neuen Abruf bei GitHub (Ergebnis nach etwa 1 bis 2 Minuten). Ohne Token lädt der Knopf nur den zuletzt veröffentlichten Stand."),
    h("ol", { class: "steps" },
      h("li", {}, h("a", { href: prefill, style: "text-decoration:underline" }, "Diesen Link öffnen"), ". GitHub verlangt dabei dein Login. Name, Ablauf von 1 Jahr und das Recht „Actions“ sind schon vorausgefüllt."),
      h("li", {}, `Unter „Repository access“ den Punkt „Only select repositories“ wählen und dann ${repo.split("/")[1]} auswählen.`),
      h("li", {}, "Unter „Permissions“ → „Repository permissions“ muss „Actions“ auf „Read and write“ stehen. Falls nicht, dort einstellen."),
      h("li", {}, "Ganz unten „Generate token“ klicken, das Token (beginnt mit github_pat_) kopieren und hier einfügen.")),
    tok,
    h("div", { class: "actions" },
      h("button", { class: "btn primary", onclick: () => { const v = tok.value.trim(); if (v) { store.set("ghtoken", v); msg.textContent = "Token gespeichert (nur auf diesem Gerät). Jetzt „Testen“ drücken."; } } }, "Speichern"),
      h("button", { class: "btn", onclick: testToken }, "Testen"),
      h("button", { class: "btn", onclick: () => { store.del("ghtoken"); tok.value = ""; msg.textContent = "Token entfernt."; } }, "Entfernen")),
    msg,
    h("p", { class: "note" }, "Das Token liegt nur im Browser dieses Geräts und darf ausschließlich Abrufe für dieses Repository starten, mehr nicht. Auf fremden Geräten bitte nicht speichern. Nach einem Jahr läuft es ab, dann einfach ein neues erzeugen."),
    h("h3", { class: "sec2" }, "Übersetzung"),
    h("label", { class: "chk" }, h("input", { type: "checkbox", checked: translating() || null, onchange: (e) => { store.set("tr", e.target.checked ? "1" : "0"); renderAll(); } }),
      " Fremdsprachige Meldungen auf Deutsch zeigen"),
    h("p", { class: "note" }, "Englische, spanische, französische, italienische und portugiesische Überschriften werden maschinell übersetzt (freies Modell OPUS-MT, läuft bei GitHub, ohne Kosten). Die Übersetzung kann Fehler enthalten. Auf jeder Karte zeigt ein Tipp auf das Etikett „übersetzt aus …“ das Original."),
    h("h3", { class: "sec2" }, "Depot"),
    h("p", { class: "note" }, DEPOT ? "Dein Depot ist auf diesem Gerät entsperrt." : "Dein Depot ist gesperrt."),
    h("div", { class: "actions" },
      h("button", { class: "btn", onclick: () => { store.del("depotpw"); DEPOT = null; renderAll(); dlg.close(); } }, "Passwort auf diesem Gerät vergessen"))));
  dlg.showModal();
}
$("btn-settings").addEventListener("click", openSettings);

// ------------------------------------------------------------------ Start

async function init() {
  DATA.history ||= [];
  const known = (x) => x && (BUILD[x] || ROUTES[x]);
  let start = location.hash.slice(1);
  if (!known(start)) start = store.get("tab");
  if (!known(start)) start = "heute";
  const route = ROUTES[start];
  CURRENT = route ? route[0] : start;
  if (route) { if (SUBS[CURRENT]) SUB[CURRENT] = route[1]; else if (CURRENT === "region") store.set("regionf", route[1]); }
  renderAll();
  await autoUnlock();
  renderAll();
}
init();
</script>
